{% extends 'base.html' %}

{% block title %}О наc {% endblock %}

{% block content %}

<style>
    :root {
        --primary-color: #2c3e50;
        --accent-color: #3498db;
        --text-color: #555;
        --bg-light: #f9f9f9;
    }

    .about-container {
        max-width: 1000px;
        margin: 50px auto;
        padding: 0 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: var(--text-color);
    }

    .hero-section {
        text-align: center;
        margin-bottom: 60px;
    }

    .hero-section h1 {
        font-size: 2.5rem;
        color: var(--primary-color);
        margin-bottom: 15px;
    }

    .features-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 30px;
        margin-bottom: 60px;
    }

    .feature-card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        border-top: 4px solid var(--accent-color);
        transition: transform 0.3s ease;
    }

    .feature-card:hover {
        transform: translateY(-5px);
    }

    .feature-card h3 {
        color: var(--primary-color);
        margin-top: 0;
    }

    .contact-box {
        display: flex;
        flex-wrap: wrap;
        background: var(--bg-light);
        border-radius: 15px;
        overflow: hidden;
        align-items: center;
    }

    .contact-info, .contact-image {
        flex: 1;
        min-width: 300px;
        padding: 40px;
    }

    .contact-info h2 {
        color: var(--primary-color);
        margin-top: 0;
    }

    .contact-list {
        list-style: none;
        padding: 0;
    }

    .contact-list li {
        margin-bottom: 10px;
    }

    .contact-list strong {
        color: var(--primary-color);
    }
</style>

<div class="about-container">
    <section class="hero-section">
        <h1>О нас</h1>
        <p></p>
    </section>

    <div class="features-grid">
        <div class="feature-card">
            <h3></h3>
            <p></p>
        </div>

    </div>

    <section class="contact-box">
        <div class="contact-info">
            <h2>Свяжитесь с нами</h2>
            <p>Есть вопросы по работе личного кабинета или предложения? Мы всегда рады обратной связи!</p>
            <ul class="contact-list">
                <li><strong>Email:</strong></li>
                <li><strong>Телефон:</strong></li>
                <li><strong>Адрес:</strong></li>
            </ul>
        </div>
    </section>
</div>
{% endblock %}
